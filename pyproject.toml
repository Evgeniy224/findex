[project]
name = "findex"
version = "1.0.0"
description = "Міні-пошукова система з інвертованим індексом, булевим парсером та ранжуванням TF-IDF/BM25"
readme = "README.md"
authors = [
    { name = "Bushkovskiy Evgeniy", email = "evgeniy.bushkovskiy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "fastapi>=0.115.0,<0.116.0",
    "jinja2>=3.1.5",
    "pydantic-settings>=2.7.0",
    "rich>=13.9.4",
    "typer>=0.15.1",
    "uvicorn[standard]>=0.34.0",
    "numpy>=2.2",
    "sentence-transformers>=5.0",
]

[project.scripts]
findex = "findex.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findex"]

[tool.hatch.build.targets.editable]
packages = ["src/findex"]

[dependency-groups]
dev = [
    "hypothesis>=6.122.0",
    "matplotlib>=3.11.2",
    "pyright>=1.1.390",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "httpx>=0.28.1",
    "pytest-benchmark>=5.0",
    "py-spy>=0.4",
    "scalene>=1.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: тести, що виконуються довше 1 секунди (наприклад, на великому корпусі)",
]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
